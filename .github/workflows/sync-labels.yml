name: Sync labels

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.json
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-labels
  cancel-in-progress: true

jobs:
  sync:
    name: Apply repository label taxonomy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          jq -c '.[]' .github/labels.json | while IFS= read -r label; do
            name="$(jq -r '.name' <<<"$label")"
            color="$(jq -r '.color' <<<"$label")"
            description="$(jq -r '.description' <<<"$label")"
            encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"

            if gh api "repos/${GITHUB_REPOSITORY}/labels/${encoded_name}" >/dev/null 2>&1; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/labels/${encoded_name}" \
                -f new_name="$name" \
                -f color="$color" \
                -f description="$description" >/dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f name="$name" \
                -f color="$color" \
                -f description="$description" >/dev/null
            fi

            echo "Synced ${name}"
          done
