function deploys(short=false){const d=[['Customer Portal · v2.4.1','Production · Acme Corporation','Success','ok'],['API Gateway · v1.8.0','Staging · Blue Ridge Systems','Deploying','run'],['Billing Worker · v3.2.0','Production · Cedar Medical','Degraded','warn'],['Security Policies · v1.2','Production · Delta Construction','Success','ok']];return d.slice(0,short?3:4).map(x=>`<div class="deploy"><div><div class="name">${x[0]}</div><div class="meta">${x[1]}</div></div><span class="badge ${x[3]}">${x[2]}</span></div>`).join('')}

function metrics(){return `<div class="kpis"><div class="panel kpi"><div class="l">Active Clients</div><div class="v">12</div><div class="sub"><span class="up">↑ 20%</span> from last month</div></div><div class="panel kpi"><div class="l">Environments</div><div class="v">48</div><div class="sub"><span class="up">↑ 9%</span> across all regions</div></div><div class="panel kpi"><div class="l">Healthy Deployments</div><div class="v">42 <span style="font-size:10px;color:#16a34a">/ 48</span></div><div class="sub"><span class="up">87.5% healthy</span> · 4 degraded</div></div><div class="panel kpi"><div class="l">Active Incidents</div><div class="v">2</div><div class="sub"><span class="down">1 critical</span> · 1 warning</div></div></div>`}
function mainDesktop(){return `<div class="desktop"><aside class="sidebar"><div class="brand"><span class="brandmark">A</span> Acme Platform</div>${[['⌂','Overview'],['▦','Clients'],['◫','Deployments'],['◇','Environments'],['◈','Infrastructure'],['◷','Monitoring'],['☷','Logs & Events'],['☑','Incidents'],['⇄','Workflows']].map(([i,t],j)=>`<div class="nav ${j===0?'active':''}"><span class="sym">${i}</span>${t}</div>`).join('')}<div class="sidelabel">Administration</div>${[['⚙','Configuration'],['♙','Users & Access'],['▧','Audit Log']].map(([i,t])=>`<div class="nav"><span class="sym">${i}</span>${t}</div>`).join('')}<div class="profile"><div class="avatar">SC</div><div><b>Sarah Chen</b><div class="mutedtext">Platform Administrator</div></div></div></aside><div class="main"><div class="topbar"><div class="search">⌕ &nbsp; Search clients, deployments, environments…</div><div class="topright"><span>◷ Live updates</span><span>♧</span><span>⚙</span><div class="avatar" style="width:22px;height:22px">SC</div></div></div><div class="content"><div class="titleline"><div><h2>Platform Operations</h2><p>Monitor infrastructure, deployments, and system health across all client environments.</p></div><div class="titleactions"><button class="btn ghost">Last 24 hours ⌄</button><button class="btn">+ New Deployment</button></div></div>${metrics()}<div class="dashrow"><div class="panel"><div class="sectionhd">Infrastructure Topology <span>Production · US East &nbsp;↗</span></div><div class="topology">${topology}</div></div><div class="panel"><div class="sectionhd">Recent Deployments <span>View all →</span></div><div class="deploymentlist">${deploys()}</div></div></div><div class="bottomrow"><div class="panel"><div class="sectionhd">Live Event & Log Stream <span><span style="color:#16a34a">●</span> Connected &nbsp; Filter ⌄</span></div><div class="logs"><div><span class="logtime">16:07:24.280</span> <span class="loginfo">INFO</span> deployment-service &nbsp; rollout started for api-gateway v1.8.0</div><div><span class="logtime">16:07:23.884</span> <span class="logok">PASS</span> health-check &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 4/5 instances healthy</div><div><span class="logtime">16:07:23.191</span> <span class="logwarn">WARN</span> billing-api &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; p95 latency above threshold: 812ms</div><div><span class="logtime">16:07:22.006</span> <span class="loginfo">INFO</span> event-processor &nbsp;&nbsp; 184 events processed in 1m window</div><div><span class="logtime">16:07:20.712</span> <span class="logok">PASS</span> migration-worker &nbsp; schema validation completed</div><div><span class="logtime">16:07:18.399</span> <span class="loginfo">INFO</span> tenant-manager &nbsp;&nbsp;&nbsp; cedar-medical configuration reloaded</div></div></div><div class="panel"><div class="sectionhd">Incidents & Alerts <span>2 open · View incident center →</span></div>${incidents()}</div></div></div></div></div>`}
function metricsMini(){return `<div class="mkpis"><div class="panel"><div class="l">Clients</div><div class="v">12</div><div class="mutedtext up">↑ 20%</div></div><div class="panel"><div class="l">Environments</div><div class="v">48</div><div class="mutedtext up">↑ 9%</div></div><div class="panel"><div class="l">Healthy</div><div class="v">42</div><div class="mutedtext up">87.5%</div></div><div class="panel"><div class="l">Incidents</div><div class="v">2</div><div class="mutedtext down">1 critical</div></div></div>`}
function mobile(kind){const isTablet=kind==='tablet';return `<div class="${kind}"><div class="mobilehead"><span style="display:flex;gap:7px;align-items:center"><span style="font-size:14px">☰</span><span class="brandmark">A</span>Acme Platform</span><span>⌕ &nbsp; ♧</span></div><div class="mobilecontent"><div class="mobtitle">${isTablet?'Platform Operations':'Overview'}</div><p class="mobsub">Live infrastructure and deployment health</p>${metricsMini()}${isTablet?`<div class="panel"><div class="sectionhd">Infrastructure Topology <span>↗</span></div><div class="smalltopology">${topology}</div></div>`:''}<div class="panel"><div class="sectionhd">${isTablet?'Recent Deployments':'Deployments'} <span>View all →</span></div><div class="deploymentlist">${deploys(!isTablet)}</div></div><div class="panel"><div class="sectionhd">Incidents <span>2 open</span></div>${incidents(!isTablet)}</div></div><div class="mobilenav"><span class="sel"><strong>▣</strong>Overview</span><span><strong>◫</strong>Deploy</span><span><strong>♧</strong>Events</span><span><strong>≡</strong>More</span></div></div>`}
function board(theme){return `<section class="poster ${theme==='dark'?'theme-dark':''}"><div class="heading"><div><h1>Operations & Control Plane — ${theme==='dark'?'Dark':'Light'} Theme</h1><p>Infrastructure topology, deployment orchestration, incident management, and live event monitoring · Desktop, tablet, and phone</p></div><div class="pills"><span class="pill">Operations</span><span class="pill muted">Deployments</span><span class="pill muted">Monitoring</span><span class="pill muted">Responsive</span></div></div><div class="board">${mainDesktop()}${mobile('tablet')}${mobile('phone')}</div><div class="bottomcaption"><span>Desktop — Full Control Plane <em> · Parallel monitoring and action workflows</em></span><span>Tablet — Contextual Overview</span><span>Phone — Prioritized Operations</span></div></section>`}
document.getElementById('poster').outerHTML=board('light')+board('dark')+`<div class="footer"><div><strong>Operations & Control Plane — Visual Baseline v0.1</strong> · Illustrative data and interface behaviors</div><div>Shared design tokens · Slate + blue · SVG topology · Responsive UI · Light & dark</div></div>`;
</script></body></html>
